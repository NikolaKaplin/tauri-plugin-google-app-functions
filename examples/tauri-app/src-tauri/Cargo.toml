[package]
name = "tauri-app"
version = "0.1.0"
description = "Todo list demo of tauri-plugin-google-app-functions"
publish = false
edition = "2024"
rust-version = "1.90"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.0", default-features = false , features = [] }
tauri-plugin-google-app-functions-build = { path = "../../../crates/build" }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-google-app-functions = { path = "../../../" }
serde_json = "1"

[features]
# App functions that test every type mapping and error path; used by test-app-functions.sh.
test-functions = []

