[package]
name = "tauri-plugin-google-app-functions"
version = "0.1.0"
authors = ["NikolaKaplin (https://github.com/NikolaKaplin)"]
description = "Expose Rust functions of a Tauri app as Android AppFunctions"
repository = "https://github.com/NikolaKaplin/tauri-plugin-google-app-functions"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples"]
links = "tauri-plugin-google-app-functions"

[workspace]
members = ["crates/macros", "crates/build"]
exclude = ["examples/tauri-app/src-tauri"]

[dependencies]
tauri = { version = "2.12.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
inventory = "0.3"
tauri-plugin-google-app-functions-macros = { version = "0.1.0", path = "crates/macros" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tauri = { version = "2.12.0", features = ["test"] }

[build-dependencies]
tauri-plugin = { version = "2.7.0", features = ["build"] }
